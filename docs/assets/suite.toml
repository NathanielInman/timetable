# What dot-files needs to know about Timetable. Its README is built from this
# file (docs/bar/build.py in NathanielInman/dotfiles reads it beside the
# hero), so a change here reaches that README on its next build.

name = "Timetable"
repo = "https://github.com/NathanielInman/timetable"
language = "Rust"
# Its module in packages/waybar/.config/waybar/config.jsonc.
module = "custom/timetable"
# "Timetable for <purpose>" in the README's list of the suite.
purpose = "the day"
# The "In the bar" cell of the suite table.
lamp = "The clock, with the next meeting beside it"
# Scripts and programs it replaced. dot-files' build fails if a doc still
# mentions one outside a sentence that says it was replaced.
retired = [
  "timezone.sh",
  "pomodoro.sh",
]
# Its stow package in dot-files, or "" when it needs none.
stow = "timetable"
# Install from a clean Arch machine, run in order.
install = [
  "sudo pacman -S --needed gtk4 gtk4-layer-shell",
  "git clone https://github.com/NathanielInman/timetable.git ~/Sites/timetable",
  "cd ~/Sites/timetable && cargo build --release",
  "install -Dm755 target/release/timetable target/release/timetable-board -t ~/.local/bin/",
  "broker set TIMETABLE_ICAL_URL --public --desc \"Google Calendar secret iCal address for Timetable\"",
]
# Run after installing (and stowing) to check the setup.
check = [
  "timetable doctor",
]
