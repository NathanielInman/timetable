[package]
name = "timetable-board"
description = "Timetable drawer: the GTK4 layer-shell panel"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

# The layer-shell drawer is Linux only.
[target.'cfg(target_os = "linux")'.dependencies]
timetable-core = { path = "../timetable-core" }
bar-anchor = { path = "../bar-anchor" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_12"] }
gtk4-layer-shell = "0.8"
async-channel = "2"
chrono.workspace = true
chrono-tz.workspace = true
